name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # global.json pins the SDK; setup-dotnet honours it via the 10.0.x channel.
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WorkBench.slnx

      - name: Build
        run: dotnet build WorkBench.slnx --configuration Release --no-restore

      # The regression tests locate RuntimeData and the sample projects relative to the
      # test assembly, and both are copied there by the test project.
      - name: Test
        run: dotnet test SourceGen.Tests/SourceGen.Tests.csproj --configuration Release --no-build

      # Cross-assemblers are not installed here, so the assemble-and-compare half of the
      # regression suite is skipped; generation is still compared against the Expected
      # sources.  Install cc65/ACME/64tass/Merlin32 and set the SOURCEGEN_*_PATH variables
      # to exercise assembly as well.

      - name: Publish linux-x64
        run: ./MakeDist/publish.sh linux-x64 Release

      - name: Smoke test (binary loads and reports a missing display)
        run: |
          set +e
          ./DIST_Release/linux-x64/SourceGen 2>&1 | head -5
          # Avalonia needs an X display; in CI it should fail at platform init, which still
          # proves the assembly, entry point and framework load correctly.
          echo "exit status from GUI launch is expected to be non-zero without a display"
